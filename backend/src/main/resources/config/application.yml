# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

---
# Conditionally disable springdoc on missing api-docs profile
spring:
  config:
    activate:
      on-profile: '!api-docs'
springdoc:
  api-docs:
    enabled: false
---
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - configprops
          - env
          - health
          - info
          - jhiopenapigroups
          - logfile
          - loggers
          - threaddump
          - caches
          - liquibase
  endpoint:
    health:
      show-details: when_authorized
      roles: 'ROLE_ADMIN'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  info:
    git:
      mode: full
    env:
      enabled: true
  health:
    mail:
      enabled: false # When using the MailService, configure an SMTP server and set this to true
spring:
  application:
    name: notificariMud
  profiles:
    # The commented value for `active` can be replaced with valid Spring profiles to load.
    # Otherwise, it will be filled in by maven when building the JAR file
    # Either way, it can be overridden by `--spring.profiles.active` value passed in the commandline or `-Dspring.profiles.active` set in `JAVA_OPTS`
    active: '@spring.profiles.active@'
    group:
      dev:
        - secret-samples
        - api-docs
  jmx:
    enabled: false
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.timezone.default_storage: NORMALIZE
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: true
      hibernate.cache.use_second_level_cache: true
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      # modify batch size as necessary
      hibernate.jdbc.batch_size: 25
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.query.fail_on_pagination_over_collection_fetch: true
      hibernate.query.in_clause_parameter_padding: true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
  messages:
    basename: i18n/messages
  main:
    allow-bean-definition-overriding: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          authority-prefix: ''
          authorities-claim-name: auth
  task:
    execution:
      thread-name-prefix: notificari-mud-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: notificari-mud-scheduling-
      pool:
        # Dispecerul de livrari ocupa un fir; UserService are deja un cron zilnic.
        size: 3
  thymeleaf:
    mode: HTML
  output:
    ansi:
      console-available: true
---
spring:
  servlet:
    multipart:
      # Arhiva de sabloane e mica; limita implicita de 1MB ar fi fost strimta
      # doar daca cineva pune imagini inline in HTML-uri.
      max-file-size: 10MB
      max-request-size: 10MB

server:
  servlet:
    session:
      cookie:
        http-only: true

springdoc:
  show-actuator: true

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  mail:
    from: notificariMud@localhost
  api-docs:
    default-include-pattern: /api/**
    management-include-pattern: /management/**
    title: Notificari Mud API
    description: Notificari Mud API documentation
    version: 0.0.1
    terms-of-service-url:
    contact-name:
    contact-url:
    contact-email:
    license: unlicensed
    license-url:
  security:


# jhipster-needle-add-application-yaml-document
---
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

application:
  messaging:
    # Doua butoane cu intelesuri diferite:
    #   enabled: false             -> oprit. Trimiterea e refuzata, dispecerul sta.
    #   channels.<x>.provider: mock -> pornit, dar simulat: istoricul se populeaza,
    #                                  dar nimic nu pleaca din aplicatie.
    enabled: true
    # false = se trimite inline, in cererea HTTP, ca inainte de coada.
    async: true
    channels:
      # Implicit totul e pe mock, ca un clone proaspat sa porneasca fara
      # variabile de mediu si sa nu trimita nimic real din greseala.
      email:
        provider: mock # mock | smtp
        batch-size: 25
        min-interval: 200ms
      # Telegramul real se porneste tot dintr-o variabila de mediu:
      #   setx MESSAGING_TELEGRAM_PROVIDER telegram-bot
      #   setx TELEGRAM_BOT_TOKEN tokenul-de-la-BotFather
      # Chat ID-urile se leaga din Destinatari -> Conecteaza Telegram: un bot nu
      # poate scrie primul nimanui, deci omul trebuie sa-i dea /start intai.
      telegram:
        provider: ${MESSAGING_TELEGRAM_PROVIDER:mock} # mock | telegram-bot
        batch-size: 25
        # ~20 mesaje/s, sub limita de ~30/s a Telegram.
        min-interval: 50ms
        options:
          bot-token: ${TELEGRAM_BOT_TOKEN:}
          # Se schimba doar pentru teste contra unui server fals.
          base-url: ${TELEGRAM_BASE_URL:https://api.telegram.org}
      # Discordul real se porneste tot dintr-o variabila de mediu:
      #   setx MESSAGING_DISCORD_PROVIDER discord-bot
      #   setx DISCORD_BOT_TOKEN tokenul botului din Developer Portal
      #   setx DISCORD_GUILD_ID id-ul serverului pe care e invitat botul
      # User ID-urile se leaga din Destinatari -> Conecteaza Discord: botul poate
      # trimite DM doar cuiva de pe acelasi server.
      discord:
        provider: ${MESSAGING_DISCORD_PROVIDER:mock} # mock | discord-bot
        batch-size: 25
        min-interval: 100ms
        options:
          bot-token: ${DISCORD_BOT_TOKEN:}
          guild-id: ${DISCORD_GUILD_ID:}
          base-url: ${DISCORD_BASE_URL:https://discord.com/api/v10}
    dispatcher:
      poll-interval: 5s
      # Cat poate sta o livrare SENDING inainte sa fie considerata abandonata.
      visibility-timeout: 5m
      max-attempts: 5
      # ~30s, ~90s, ~4.5min, ~13.5min, apoi FAILED.
      backoff-initial: 30s
      backoff-multiplier: 3
      backoff-max: 1h
      backoff-jitter: 0.2
